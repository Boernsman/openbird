[platformio]
default_envs = esp32-poe-iso

[env:esp32-poe-iso]
platform = espressif32@6.12.0
board = esp32-poe-iso
framework = arduino
monitor_speed = 115200
; Asserted DTR/RTS (the serial default) disturb the board and drop the Ethernet link
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    bblanchon/ArduinoJson@7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Network update: OPENBIRD_HOST=bha-<mac>.local OPENBIRD_PASSWORD=... pio run -e ota -t upload
[env:ota]
extends = env:esp32-poe-iso
upload_protocol = espota
upload_port = ${sysenv.OPENBIRD_HOST}
upload_flags =
    --auth=${sysenv.OPENBIRD_PASSWORD}
